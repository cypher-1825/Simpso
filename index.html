<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f1a">
    <title>StreamPlay IPTV</title>
    
    <!-- Iconos y HLS para TV en Vivo -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* ============================================================
           CSS COMPLETO (Integrado)
           ============================================================ */
        :root {
            --bg-main: #0b0f1a; --bg-card: #131a2a; --bg-card-hover: #1e2942;
            --text-main: #eef2fa; --text-muted: #8b96ad;
            --primary: #5b8cff; --primary-hover: #7c5bff;
            --danger: #ff5c6c; --border: #232c42; --radius: 16px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-family); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

        /* Loader */
        .global-loader { position: fixed; inset: 0; z-index: 9999; background-color: rgba(11, 15, 26, 0.85); backdrop-filter: blur(5px); display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.3s ease; }
        .global-loader.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        .loader-text { color: var(--text-muted); font-size: 14px; font-weight: 500; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Header */
        header { position: sticky; top: 0; z-index: 100; background: rgba(11, 15, 26, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .header-inner { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; cursor: pointer; }
        .logo-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); display: grid; place-items: center; color: white; font-size: 14px; }
        .logo-mark.large { width: 56px; height: 56px; font-size: 24px; margin: 0 auto 12px; }
        .logo-text span { color: var(--primary); }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; display: grid; place-items: center; transition: all 0.2s ease; }
        .icon-btn:hover { color: var(--text-main); border-color: var(--primary); }

        /* Main */
        main { max-width: 1400px; margin: 0 auto; padding: 24px 20px 80px; min-height: calc(100vh - 120px); }
        .view-header { margin-bottom: 24px; }
        .view-header h1 { margin: 0 0 8px; font-size: 28px; font-weight: 800; }
        .view-header p { margin: 0; color: var(--text-muted); font-size: 14px; }

        /* Grid de Tarjetas */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        .card { background: var(--bg-card); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-media { position: relative; aspect-ratio: 2/3; background: #070b14; width: 100%; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 14px; font-weight: 700; margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 12px; color: var(--text-muted); margin-top: auto; }
        .card-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); color: #ffc107; font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 4px; display: flex; align-items: center; gap: 3px; }

        /* Botones */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .full-width { width: 100%; }

        /* Modales */
        .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 400px; padding: 24px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { text-align: center; margin-bottom: 24px; }
        .modal-header h2 { margin: 0 0 4px; font-size: 22px; }
        .modal-header p { margin: 0; color: var(--text-muted); font-size: 13px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 700; }
        .input-group input { width: 100%; padding: 14px 16px; border-radius: 10px; background: #070b14; border: 1px solid var(--border); color: var(--text-main); font-size: 14px; outline: none; transition: border-color 0.2s ease; }
        .input-group input:focus { border-color: var(--primary); }
        .alert.error { background: rgba(255, 92, 108, 0.1); border: 1px solid rgba(255, 92, 108, 0.3); color: #ffb4bb; padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 13px; text-align: center; }
        .hidden { display: none !important; }

        /* Reproductor */
        .player-modal { position: fixed; inset: 0; z-index: 300; background: #000; display: none; flex-direction: column; }
        .player-modal.active { display: flex; }
        .player-modal-content { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .player-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(0,0,0,0.8); }
        .player-header h2 { margin: 0; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
        .video-container { flex-grow: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
        .video-container video { width: 100%; height: 100%; max-height: 100%; object-fit: contain; outline: none; }
        .episode-selector-container { background: #0b0f1a; padding: 16px; max-height: 30vh; overflow-y: auto; border-top: 1px solid var(--border); }
        .episode-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .episode-btn { padding: 8px 14px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); font-size: 13px; cursor: pointer; transition: all 0.2s ease; }
        .episode-btn:hover { color: var(--text-main); border-color: var(--primary); }
        .episode-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* Barra de búsqueda */
        .search-bar { position: relative; margin-bottom: 20px; }
        .search-bar input { width: 100%; padding: 14px 16px 14px 44px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); font-size: 15px; outline: none; transition: border-color 0.2s; }
        .search-bar input:focus { border-color: var(--primary); }
        .search-bar i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        @media (min-width: 640px) { .card-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
        @media (min-width: 1024px) { .card-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } main { padding: 40px; } }
    </style>
</head>
<body>

    <!-- LOADER GLOBAL -->
    <div id="global-loader" class="global-loader hidden">
        <div class="spinner"></div>
        <div class="loader-text" id="loader-text">Cargando...</div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="header-inner">
            <div class="logo" onclick="goHome()">
                <span class="logo-mark"><i class="fa-solid fa-play"></i></span>
                <span class="logo-text">Stream<span>Play</span></span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="goHome()" title="Inicio"><i class="fa-solid fa-house"></i></button>
                <button class="icon-btn" onclick="openLogin()" title="Cuenta"><i class="fa-solid fa-user"></i></button>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="app-container"></main>

    <!-- REPRODUCTOR MODAL -->
    <div id="player-modal" class="player-modal">
        <div class="player-modal-content">
            <div class="player-header">
                <h2 id="player-title">Título</h2>
                <button class="icon-btn" onclick="closePlayer()"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="video-container">
                <video id="main-player" controls autoplay playsinline></video>
            </div>
            <div id="episode-selector-container" class="episode-selector-container"></div>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="logo-mark large"><i class="fa-solid fa-lock"></i></div>
                <h2>Conectar Cuenta</h2>
                <p>Ingresa tus credenciales IPTV</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Servidor (URL)</label>
                    <input type="text" id="login-server" placeholder="http://servidor.com">
                </div>
                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" id="login-username" placeholder="Usuario">
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="Contraseña">
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-login" class="btn btn-primary full-width">Conectar</button>
            </div>
            <div id="login-error" class="alert error hidden"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // LÓGICA JAVASCRIPT COMPLETA (Integrada)
        // ============================================================

        // Configuración extraída de tu primer archivo
        const CONFIG = {
            server: 'http://liontv.es',
            username: 'Gerardotv1',
            password: 'Alvaradotv1'
        };

        const state = {
            currentView: 'home',
            movies: [],
            series: [],
            live: [],
            currentPlaylist: [],
            hls: null
        };

        // Elementos DOM
        const loader = document.getElementById('global-loader');
        const loaderText = document.getElementById('loader-text');
        const appContainer = document.getElementById('app-container');
        const loginModal = document.getElementById('login-modal');
        const loginError = document.getElementById('login-error');
        const playerModal = document.getElementById('player-modal');
        const videoElement = document.getElementById('main-player');
        const playerTitle = document.getElementById('player-title');

        // ============================================================
        // UTILIDADES Y CONEXIÓN
        // ============================================================
        function showLoader(show, text = 'Cargando...') {
            if (show) {
                loaderText.textContent = text;
                loader.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        function showToast(msg, icon = 'info') {
            Swal.fire({ toast: true, position: 'top-end', icon, title: msg, showConfirmButton: false, timer: 3000, background: '#131a2a', color: '#eef2fa' });
        }

        // Función central para conectar con Xtream Codes
        async function fetchAPI(action = '', extraParams = {}) {
            let url = `${CONFIG.server}/player_api.php?username=${CONFIG.username}&password=${CONFIG.password}`;
            if (action) url += `&action=${action}`;
            
            for (const key in extraParams) {
                url += `&${key}=${extraParams[key]}`;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
                const data = await response.json();
                if (data.user_info && data.user_info.auth === 0) {
                    throw new Error("Credenciales incorrectas o cuenta expirada.");
                }
                return data;
            } catch (error) {
                console.error("API Error:", error);
                throw new Error("No se pudo conectar al servidor. (Posible bloqueo CORS)");
            }
        }

        // ============================================================
        // NAVEGACIÓN Y RENDERIZADO
        // ============================================================
        function goHome() {
            state.currentView = 'home';
            appContainer.innerHTML = `
                <div class="view-header">
                    <h1>Explorar</h1>
                    <p>Selecciona una categoría</p>
                </div>
                <div class="card-grid" style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));">
                    <div class="card" onclick="loadData('movies', 'Películas')">
                        <div class="card-media" style="aspect-ratio: 16/9; background: linear-gradient(135deg, #17b978, #5b8cff); display: grid; place-items: center;">
                            <i class="fa-solid fa-film" style="font-size: 64px; color: white;"></i>
                        </div>
                        <div class="card-body"><h3 class="card-title">Películas</h3><p class="card-meta">Catálogo VOD</p></div>
                    </div>
                    <div class="card" onclick="loadData('series', 'Series')">
                        <div class="card-media" style="aspect-ratio: 16/9; background: linear-gradient(135deg, #7c5bff, #ff5c6c); display: grid; place-items: center;">
                            <i class="fa-solid fa-tv" style="font-size: 64px; color: white;"></i>
                        </div>
                        <div class="card-body"><h3 class="card-title">Series</h3><p class="card-meta">Temporadas y Episodios</p></div>
                    </div>
                    <div class="card" onclick="loadData('live', 'TV en Vivo')">
                        <div class="card-media" style="aspect-ratio: 16/9; background: linear-gradient(135deg, #ff5c6c, #ff8b3d); display: grid; place-items: center;">
                            <i class="fa-solid fa-tower-broadcast" style="font-size: 64px; color: white;"></i>
                        </div>
                        <div class="card-body"><h3 class="card-title">TV en Vivo</h3><p class="card-meta">Canales en Directo</p></div>
                    </div>
                </div>
            `;
        }

        async function loadData(type, title) {
            state.currentView = type;
            showLoader(true, `Cargando ${title}...`);
            appContainer.innerHTML = '';

            try {
                let action = '';
                if (type === 'movies') action = 'get_vod_streams';
                else if (type === 'series') action = 'get_series';
                else if (type === 'live') action = 'get_live_streams';

                const data = await fetchAPI(action);
                
                let items = [];
                if (type === 'series' && data.series) items = data.series;
                else if (Array.isArray(data)) items = data;

                state[type] = items;
                renderGrid(items, type, title);

            } catch (error) {
                appContainer.innerHTML = `
                    <div class="view-header" style="text-align:center; padding: 40px;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 48px; color: var(--danger); margin-bottom: 16px;"></i>
                        <h1>Error de Conexión</h1>
                        <p style="max-width: 500px; margin: 0 auto 20px;">${error.message}</p>
                        <button class="btn btn-primary" onclick="openLogin()">Revisar Credenciales</button>
                    </div>
                `;
            } finally {
                showLoader(false);
            }
        }

        function renderGrid(items, type, title) {
            if (!items || items.length === 0) {
                appContainer.innerHTML = `<div class="view-header"><h1>${title}</h1><p>No hay contenido disponible.</p></div>`;
                return;
            }

            let html = `
                <div class="view-header">
                    <button class="btn btn-primary" style="margin-bottom: 15px; padding: 8px 16px; font-size: 12px;" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> Volver</button>
                    <h1>${title}</h1>
                    <p>${items.length} títulos encontrados</p>
                </div>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar en ${title}..." onkeyup="filterGrid(this.value)">
                </div>
                <div class="card-grid" id="main-grid">
            `;

            items.forEach(item => {
                const name = item.name || item.title || 'Sin título';
                const id = item.stream_id || item.series_id || '';
                const icon = item.stream_icon || item.cover || 'https://via.placeholder.com/300x450/131a2a/5f6a82?text=Sin+Portada';
                const rating = item.rating || '0';
                
                html += `
                    <div class="card" data-name="${name.toLowerCase()}" onclick="handleCardClick('${type}', '${id}', '${name.replace(/'/g, "\\'")}')">
                        <div class="card-media">
                            <img src="${icon}" alt="${name}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/131a2a/5f6a82?text=Sin+Portada'">
                            ${parseFloat(rating) > 0 ? `<span class="card-badge"><i class="fa-solid fa-star"></i> ${parseFloat(rating).toFixed(1)}</span>` : ''}
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">${name}</h3>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            appContainer.innerHTML = html;
            state.currentView = type;
        }

        function filterGrid(query) {
            const cards = document.querySelectorAll('.card');
            const q = query.toLowerCase();
            cards.forEach(card => {
                if (card.dataset.name.includes(q)) card.style.display = 'flex';
                else card.style.display = 'none';
            });
        }

        // ============================================================
        // DETALLES Y REPRODUCCIÓN
        // ============================================================
        async function handleCardClick(type, id, name) {
            if (type === 'series') {
                loadSeasons(id, name);
            } else {
                playStream(type, id, name);
            }
        }

        async function loadSeasons(seriesId, seriesName) {
            showLoader(true, 'Cargando temporadas...');
            try {
                const data = await fetchAPI('get_series_info', { series_id: seriesId });
                const seasons = data.seasons || [];
                
                let html = `
                    <div class="view-header">
                        <button class="btn btn-primary" style="margin-bottom: 15px; padding: 8px 16px; font-size: 12px;" onclick="loadData('series', 'Series')"><i class="fa-solid fa-arrow-left"></i> Volver</button>
                        <h1>${seriesName}</h1>
                        <p>Selecciona una temporada</p>
                    </div>
                    <div class="card-grid">
                `;

                if (seasons.length === 0) html += `<p>No hay temporadas disponibles.</p>`;

                seasons.forEach(s => {
                    const sNum = s.season_number;
                    const sName = s.name || `Temporada ${sNum}`;
                    html += `
                        <div class="card" onclick="loadEpisodes('${seriesId}', '${sNum}', '${seriesName.replace(/'/g, "\\'")}')">
                            <div class="card-media" style="background: var(--bg-card); display: grid; place-items: center;">
                                <i class="fa-solid fa-list-ol" style="font-size: 56px; color: var(--primary);"></i>
                            </div>
                            <div class="card-body"><h3 class="card-title">${sName}</h3></div>
                        </div>
                    `;
                });
                html += `</div>`;
                appContainer.innerHTML = html;
            } catch (err) {
                showToast(err.message, 'error');
                loadData('series', 'Series');
            } finally {
                showLoader(false);
            }
        }

        async function loadEpisodes(seriesId, seasonNum, seriesName) {
            showLoader(true, 'Cargando episodios...');
            try {
                const data = await fetchAPI('get_series_info', { series_id: seriesId });
                const episodes = data.episodes ? data.episodes[seasonNum] : [];
                
                if (!episodes || episodes.length === 0) {
                    showToast('No hay episodios para esta temporada', 'info');
                    return;
                }

                state.currentPlaylist = episodes;

                let html = `
                    <div class="view-header">
                        <button class="btn btn-primary" style="margin-bottom: 15px; padding: 8px 16px; font-size: 12px;" onclick="loadSeasons('${seriesId}', '${seriesName.replace(/'/g, "\\'")}')"><i class="fa-solid fa-arrow-left"></i> Volver</button>
                        <h1>${seriesName}</h1>
                        <p>Temporada ${seasonNum} · ${episodes.length} Episodios</p>
                    </div>
                    <div class="card-grid">
                `;

                episodes.forEach((ep, i) => {
                    const epName = ep.title || `Episodio ${ep.episode_num}`;
                    const epId = ep.id;
                    html += `
                        <div class="card" onclick="playEpisode('${epId}', '${epName.replace(/'/g, "\\'")}', '${seasonNum}', '${seriesName.replace(/'/g, "\\'")}', ${i})">
                            <div class="card-media" style="background: var(--bg-card); display: grid; place-items: center;">
                                <i class="fa-solid fa-play-circle" style="font-size: 56px; color: var(--primary);"></i>
                            </div>
                            <div class="card-body">
                                <h3 class="card-title">${epName}</h3>
                                <p class="card-meta">Episodio ${ep.episode_num}</p>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                appContainer.innerHTML = html;
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                showLoader(false);
            }
        }

        // Generación de URL y apertura del reproductor
        function playStream(type, id, name) {
            let url = '';
            const ext = 'mp4'; // Extensión por defecto para películas

            if (type === 'movie') {
                url = `${CONFIG.server}/movie/${CONFIG.username}/${CONFIG.password}/${id}.${ext}`;
            } else if (type === 'live') {
                url = `${CONFIG.server}/live/${CONFIG.username}/${CONFIG.password}/${id}.m3u8`;
            }

            openPlayer(url, name, type);
        }

        function playEpisode(id, name, season, seriesName, index) {
            const ext = 'mp4'; 
            const url = `${CONFIG.server}/series/${CONFIG.username}/${CONFIG.password}/${id}.${ext}`;
            openPlayer(url, `${seriesName} - ${name}`, 'episode', index);
        }

        function openPlayer(url, title, type, epIndex = 0) {
            playerTitle.textContent = title;
            playerModal.classList.add('active');

            if (state.hls) { state.hls.destroy(); state.hls = null; }

            // Si es TV en vivo o un enlace .m3u8, usar HLS.js
            if (type === 'live' || url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    state.hls = new Hls();
                    state.hls.loadSource(url);
                    state.hls.attachMedia(videoElement);
                    state.hls.on(Hls.Events.MANIFEST_PARSED, () => videoElement.play());
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = url;
                    videoElement.play();
                } else {
                    showToast('Tu navegador no soporta HLS', 'error');
                }
            } else {
                // Para películas y series (MP4)
                videoElement.src = url;
                videoElement.play();
            }

            // Mostrar selector de episodios si es serie
            if (type === 'episode') {
                renderEpisodesSelector(title, epIndex);
            } else {
                document.getElementById('episode-selector-container').innerHTML = '';
            }
        }

        function renderEpisodesSelector(currentTitle, currentIndex) {
            const container = document.getElementById('episode-selector-container');
            if (!state.currentPlaylist || state.currentPlaylist.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = `<h4 style="margin: 0 0 12px; font-size: 14px; color: var(--text-muted);">Lista de Episodios</h4><div class="episode-list">`;
            state.currentPlaylist.forEach((ep, i) => {
                const epName = ep.title || `Episodio ${ep.episode_num}`;
                const isActive = i === currentIndex ? 'active' : '';
                html += `<button class="episode-btn ${isActive}" onclick="playEpisode('${ep.id}', '${epName.replace(/'/g, "\\'")}', '${ep.season}', '${currentTitle.split(' - ')[0]}', ${i})">${epName}</button>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function closePlayer() {
            playerModal.classList.remove('active');
            videoElement.pause();
            videoElement.src = '';
            if (state.hls) { state.hls.destroy(); state.hls = null; }
        }

        // ============================================================
        // LOGIN Y ARRANQUE
        // ============================================================
        function openLogin() {
            document.getElementById('login-server').value = CONFIG.server;
            document.getElementById('login-username').value = CONFIG.username;
            document.getElementById('login-password').value = CONFIG.password;
            loginError.classList.add('hidden');
            loginModal.classList.add('active');
        }

        document.getElementById('btn-login').addEventListener('click', () => {
            // Solo cerramos el modal, ya que la conexión real se hace en segundo plano
            loginModal.classList.remove('active');
            showToast('Conectando al servidor...', 'info');
            goHome();
        });

        // Inicializar app
        window.addEventListener('DOMContentLoaded', () => {
            goHome(); // Carga la pantalla principal
        });
    </script>
</body>
</html>
