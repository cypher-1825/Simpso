<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const CONFIG = {
    TMDB_API_KEY: "2509cd5cbfc0e5171ebcb051380187a2",
    LANG: "es-ES",
    IMG_BASE: "https://image.tmdb.org/t/p/",
    TMDB_TIMEOUT: 6000,
    ADMIN: { user: "user", pass: "cypher" }
};

const GENRES_LIST = [
    'Acción','Animación','Aventura','Bélico','Ciencia Ficción','Comedia','Crimen',
    'Documental','Drama','Familia','Fantasía','Historia','Misterio','Música',
    'Romance','Suspenso','Terror','Western', 'Otros'
];

const GENRE_MAP = {
    'POLICIAL': 'Crimen', 'POLICIALES': 'Crimen',
    'SUSPENSO': 'Suspenso', 'SUSPENSE': 'Suspenso', 'THRILLER': 'Suspenso',
    'CRIMEN': 'Crimen', 'CRIMENES': 'Crimen',
    'ACCION': 'Acción', 'ACCIÓN': 'Acción',
    'AVENTURA': 'Aventura', 'AVENTURAS': 'Aventura',
    'COMEDIA': 'Comedia', 'COMEDIAS': 'Comedia',
    'DRAMA': 'Drama', 'DRAMAS': 'Drama', 'PELICULAS DE DRAMA': 'Drama', 'PELÍCULAS DE DRAMA': 'Drama',
    'TERROR': 'Terror', 'HORROR': 'Terror',
    'CIENCIA FICCION': 'Ciencia Ficción', 'CIENCIA FICCIÓN': 'Ciencia Ficción', 'SCI-FI': 'Ciencia Ficción',
    'FANTASIA': 'Fantasía', 'FANTASÍA': 'Fantasía',
    'ANIMACION': 'Animación', 'ANIMACIÓN': 'Animación',
    'BELICO': 'Bélico', 'BÉLICO': 'Bélico', 'GUERRA': 'Bélico',
    'WESTERN': 'Western', 'VAQUEROS': 'Western',
    'DOCUMENTAL': 'Documental', 'DOCUMENTALES': 'Documental',
    'MUSICAL': 'Música', 'MUSICA': 'Música', 'MÚSICA': 'Música',
    'ROMANCE': 'Romance', 'ROMANTICA': 'Romance', 'ROMÁNTICA': 'Romance',
    'MISTERIO': 'Misterio', 'MISTERIOS': 'Misterio',
    'HISTORIA': 'Historia', 'HISTORICO': 'Historia',
    'FAMILIA': 'Familia', 'FAMILIAR': 'Familia',
    'INFANTIL': 'Familia', 'NIÑOS': 'Familia'
};

// ============================================================
// ESTADO
// ============================================================
const state = {
    catalog: [],
    favorites: JSON.parse(localStorage.getItem('sp_fav_movies') || '[]'),
    isAdmin: sessionStorage.getItem('sp_admin') === '1',
    currentHeroIndex: 0,
    heroTimer: null,
    searchFilter: { genre: null, year: null, query: '', type: 'all' },
    moviesPage: 1,
    currentItem: null,
    importCancel: false,
    lastRoute: 'home',
    dbAvailable: false
};

const appContainer = document.getElementById('app');

// ============================================================
// INDEXEDDB
// ============================================================
const DB_NAME = 'SimpsotecaDB';
const DB_VERSION = 1;
const STORE = 'catalog';
let db = null;

function openDB() {
    return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
            reject(new Error('IndexedDB no soportado'));
            return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => { db = req.result; state.dbAvailable = true; resolve(db); };
        req.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains(STORE)) {
                const store = database.createObjectStore(STORE, { keyPath: 'key' });
                store.createIndex('genre', 'genre', { unique: false });
                store.createIndex('type', 'type', { unique: false });
                store.createIndex('year', 'year', { unique: false });
            }
        };
    });
}

function dbGetAll() {
    if (!state.dbAvailable) return Promise.resolve(state.catalog);
    return new Promise((resolve, reject) => {
        try {
            const tx = db.transaction(STORE, 'readonly');
            const req = tx.objectStore(STORE).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
        } catch(e) { resolve(state.catalog); }
    });
}

function dbPut(items) {
    if (!state.dbAvailable) return Promise.resolve();
    return new Promise((resolve, reject) => {
        try {
            const tx = db.transaction(STORE, 'readwrite');
            const store = tx.objectStore(STORE);
            const arr = Array.isArray(items) ? items : [items];
            arr.forEach(item => store.put(item));
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        } catch(e) { resolve(); }
    });
}

function dbPutBulk(items, onProgress) {
    if (!state.dbAvailable) {
        if (onProgress) onProgress(items.length, items.length);
        return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
        const CHUNK = 100;
        let i = 0;
        function nextChunk() {
            if (i >= items.length) return resolve();
            const chunk = items.slice(i, i + CHUNK);
            try {
                const tx = db.transaction(STORE, 'readwrite');
                const store = tx.objectStore(STORE);
                chunk.forEach(item => store.put(item));
                tx.oncomplete = () => {
                    i += CHUNK;
                    if (onProgress) onProgress(Math.min(i, items.length), items.length);
                    setTimeout(nextChunk, 10); 
                };
                tx.onerror = () => reject(tx.error);
            } catch(e) { resolve(); }
        }
        nextChunk();
    });
}

function dbDelete(key) {
    if (!state.dbAvailable) return Promise.resolve();
    return new Promise((resolve, reject) => {
        try {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).delete(key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        } catch(e) { resolve(); }
    });
}

function dbClear() {
    if (!state.dbAvailable) return Promise.resolve();
    return new Promise((resolve, reject) => {
        try {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).clear();
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        } catch(e) { resolve(); }
    });
}

// ============================================================
// UTILIDADES
// ============================================================
function showToast(msg, type = 'info') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    const bg = type === 'error' ? 'bg-red-500/90' : type === 'success' ? 'bg-green-500/90' : 'bg-cardBg';
    const border = type === 'info' ? 'border border-white/10' : '';
    t.className = `${bg} ${border} text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium transform transition-all duration-300 translate-y-[-100%] opacity-0 flex items-center gap-2 max-w-full`;
    t.innerHTML = msg;
    c.appendChild(t);
    requestAnimationFrame(() => t.classList.remove('translate-y-[-100%]','opacity-0'));
    setTimeout(() => {
        t.classList.add('opacity-0','scale-95');
        setTimeout(() => t.remove(), 300);
    }, 3000);
}

function hashString(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i) | 0;
    return Math.abs(h);
}

function makePlaceholder(title, w = 300, h = 450) {
    const hue = hashString(title) % 360;
    const initials = title.split(' ').slice(0, 2).map(x => x[0] || '').join('').toUpperCase() || '?';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="hsl(${hue},30%,18%)"></stop><stop offset="100%" stop-color="hsl(${hue},30%,8%)"></stop></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"></rect><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="${Math.floor(w/4)}" font-weight="900" fill="rgba(255,255,255,0.12)">${initials}</text></svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// TMDB
// ============================================================
async function fetchWithTimeout(url, ms) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try {
        const r = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        return r;
    } catch (e) { clearTimeout(timer); throw e; }
}

async function tmdbSearch(query) {
    if (!query.trim()) return [];
    let url = `https://api.themoviedb.org/3/search/multi?api_key=${CONFIG.TMDB_API_KEY}&language=${CONFIG.LANG}&query=${encodeURIComponent(query)}&include_adult=false`;
    try {
        const r = await fetchWithTimeout(url, CONFIG.TMDB_TIMEOUT);
        if (!r.ok) return [];
        const data = await r.json();
        return (data.results || []).filter(x => x.media_type === 'movie' || x.media_type === 'tv');
    } catch (e) { return []; }
}

async function tmdbFindBest(title, year, forceType = null) {
    const clean = title.replace(/\s*\(.*?\)\s*/g, '').trim();
    let results = await tmdbSearch(clean);
    
    if (forceType) {
        results = results.filter(x => x.media_type === forceType);
    }

    if (year) {
        const exact = results.find(x => {
            const y = (x.release_date || x.first_air_date || '').slice(0, 4);
            return String(y) === String(year);
        });
        if (exact) return exact;
    }
    return results[0] || null;
}

function getPosterUrl(item, size = 'w342') {
    if (item.poster_path) return CONFIG.IMG_BASE + size + item.poster_path;
    return makePlaceholder(item.title || item.name || '', size === 'w342' ? 342 : 500, size === 'w342' ? 513 : 750);
}

function getBackdropUrl(item, size = 'w1280') {
    if (item.backdrop_path) return CONFIG.IMG_BASE + size + item.backdrop_path;
    if (item.poster_path) return CONFIG.IMG_BASE + 'w780' + item.poster_path;
    return makePlaceholder(item.title || item.name || '', 1280, 720);
}

// ============================================================
// CATÁLOGO Y FAVORITOS
// ============================================================
function makeKeyForItem(item) {
    if (item.type === 'tv') {
        return 'tv_' + hashString(item.title + '_' + (item.year || ''));
    }
    if (item.videoUrl) return 'url_' + hashString(item.videoUrl);
    return `${item.type}_${item.tmdbId}`;
}

async function addToCatalog(item) {
    const key = makeKeyForItem(item);
    item.key = key;
    item.addedAt = Date.now();
    const exists = state.catalog.findIndex(x => x.key === key);
    if (exists > -1) {
        const prev = state.catalog[exists];
        item.addedAt = prev.addedAt || Date.now();
        if (item.isHero === undefined) item.isHero = prev.isHero || false;
        state.catalog[exists] = item;
    } else {
        state.catalog.push(item);
    }
    await dbPut(item);
}

function getHeroItems() {
    return state.catalog.filter(x => x.isHero);
}

function isFavorite(item) {
    return state.favorites.some(f => f.key === item.key);
}

function toggleFavorite(item) {
    const idx = state.favorites.findIndex(f => f.key === item.key);
    if (idx > -1) {
        state.favorites.splice(idx, 1);
        showToast('Eliminado de Mi Lista');
    } else {
        state.favorites.push({
            key: item.key, tmdbId: item.tmdbId, type: item.type,
            title: item.title, year: item.year,
            poster_path: item.poster_path, backdrop_path: item.backdrop_path,
            overview: item.overview, rating: item.rating,
            videoUrl: item.videoUrl, genre: item.genre,
            episodes: item.episodes || null
        });
        showToast('Agregado a Mi Lista', 'success');
    }
    try { localStorage.setItem('sp_fav_movies', JSON.stringify(state.favorites)); } catch(e) {}
}

// ============================================================
// ADMIN LOGIN
// ============================================================
function openAdminLogin() {
    if (state.isAdmin) { window.location.hash = 'admin'; return; }
    const m = document.getElementById('admin-login-modal');
    m.classList.remove('hidden'); m.classList.add('flex');
    document.getElementById('admin-user').value = '';
    document.getElementById('admin-pass').value = '';
    setTimeout(() => document.getElementById('admin-user').focus(), 100);
}

function closeAdminLogin() {
    const m = document.getElementById('admin-login-modal');
    m.classList.add('hidden'); m.classList.remove('flex');
}

function tryAdminLogin() {
    const u = document.getElementById('admin-user').value.trim();
    const p = document.getElementById('admin-pass').value;
    if (u === CONFIG.ADMIN.user && p === CONFIG.ADMIN.pass) {
        state.isAdmin = true;
        sessionStorage.setItem('sp_admin', '1');
        closeAdminLogin();
        showToast('👋 Bienvenido Admin', 'success');
        window.location.hash = 'admin';
    } else {
        showToast('❌ Credenciales incorrectas', 'error');
    }
}

function adminLogout() {
    state.isAdmin = false;
    sessionStorage.removeItem('sp_admin');
    showToast('Sesión cerrada');
    window.location.hash = 'home';
}

// ============================================================
// NAVEGACIÓN
// ============================================================
function goBack() {
    if (window.history.length > 1) window.history.back();
    else window.location.hash = 'home';
}

function updateHeader(showBack = true) {
    document.getElementById('btn-back').style.visibility = showBack ? 'visible' : 'hidden';
}

function updateBottomNav(route) {
    document.querySelectorAll('.nav-item').forEach(el => {
        if (el.dataset.route === route) el.classList.add('nav-active');
        else el.classList.remove('nav-active');
    });
    document.querySelectorAll('.nav-item-link').forEach(el => {
        if (el.dataset.link === route) {
            el.classList.remove('text-secondary');
            el.classList.add('text-white','font-bold');
        } else {
            el.classList.add('text-secondary');
            el.classList.remove('text-white','font-bold');
        }
    });
}

function initHeroSlider(total) {
    if (state.heroTimer) clearInterval(state.heroTimer);
    state.heroTimer = setInterval(() => {
        state.currentHeroIndex = (state.currentHeroIndex + 1) % total;
        applyHeroSlide();
    }, 6000);
}

function goToHeroSlide(index) {
    state.currentHeroIndex = index;
    applyHeroSlide();
    if (state.heroTimer) clearInterval(state.heroTimer);
    const total = document.querySelectorAll('.hero-slide').length;
    state.heroTimer = setInterval(() => {
        state.currentHeroIndex = (state.currentHeroIndex + 1) % total;
        applyHeroSlide();
    }, 6000);
}

function applyHeroSlide() {
    document.querySelectorAll('.hero-slide').forEach((el, i) => {
        el.classList.toggle('active', i === state.currentHeroIndex);
    });
    document.querySelectorAll('.hero-dot').forEach((el, i) => {
        if (i === state.currentHeroIndex) el.className = 'hero-dot w-6 h-2 rounded-full bg-accent';
        else el.className = 'hero-dot w-2 h-2 rounded-full bg-white/30';
    });
}

    return `
        <a href="#detail/${item.type}/${item.tmdbId}" class="movie-card card-tap block ${w} group">

function buildRow(title, items, route) {
    if (!items.length) return '';
    return `
        <section class="mb-8">
            <div class="flex items-center justify-between mb-3 px-4 sm:px-6">
                <h2 class="text-lg sm:text-xl font-bold text-white tracking-tight">${escapeHtml(title)}</h2>

function renderExplore() {
    updateHeader(false);

    const { genre, year, query, type } = state.searchFilter;

    let filtered = [...state.catalog];
    if (type !== 'all') filtered = filtered.filter(x => x.type === type);
    if (genre) filtered = filtered.filter(x => x.genre === genre);
    if (year) filtered = filtered.filter(x => x.year === year);
    if (query) {
        const q = query.toLowerCase();
        filtered = filtered.filter(x => x.title.toLowerCase().includes(q));
    }

    if (!query && !genre && type === 'all') {
        filtered.sort((a,b) => b.rating - a.rating);
    }

    appContainer.innerHTML = `
        <main class="px-4 sm:px-6 max-w-[1600px] mx-auto pb-10 min-h-screen fade-in pt-4">
            <h1 class="text-2xl sm:text-3xl font-black mb-4">Explorar</h1>

            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-secondary"></i>
                <input id="search-input" type="text" placeholder="Buscar películas o series..." value="${escapeHtml(query)}"
                    class="w-full bg-[#141c2f] border border-white/5 rounded-xl pl-11 pr-4 py-3 text-white placeholder-secondary outline-none focus:border-accent transition-colors">
            </div>

            <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-4 mb-4">
                <button onclick="setFilter('type','all')" class="flex-shrink-0 px-4 py-2 rounded-lg text-xs font-medium transition-colors ${type === 'all' ? 'bg-accent text-white' : 'bg-[#141c2f] text-secondary border border-white/5 hover:text-white'}">Todo</button>
                <button onclick="setFilter('type','movie')" class="flex-shrink-0 px-4 py-2 rounded-lg text-xs font-medium transition-colors ${type === 'movie' ? 'bg-accent text-white' : 'bg-[#141c2f] text-secondary border border-white/5 hover:text-white'}">Películas</button>
                <button onclick="setFilter('type','tv')" class="flex-shrink-0 px-4 py-2 rounded-lg text-xs font-medium transition-colors ${type === 'tv' ? 'bg-accent text-white' : 'bg-[#141c2f] text-secondary border border-white/5 hover:text-white'}">Series</button>
            </div>

            <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-4 mb-6">
                <button onclick="setFilter('genre',null)" class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium transition-colors ${!genre ? 'bg-white text-black' : 'bg-[#141c2f] text-secondary border border-white/5 hover:text-white'}">Todos</button>
                ${GENRES_LIST.slice(0, 10).map(g => `
                    <button onclick="setFilter('genre','${g}')" class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium transition-colors ${genre === g ? 'bg-white text-black' : 'bg-[#141c2f] text-secondary border border-white/5 hover:text-white'}">${g}</button>
                `).join('')}
            </div>

            <p class="text-sm text-secondary mb-4">${filtered.length} resultados encontrados</p>

            ${filtered.length === 0 ? `
                <div class="flex flex-col items-center justify-center mt-20 text-center">
                    <i class="fa-solid fa-film text-4xl text-secondary/30 mb-3"></i>
                    <p class="text-secondary text-sm">Sin resultados para estos filtros.</p>
                </div>
            ` : `
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-x-3 gap-y-6">
                    ${filtered.map(m => movieCard(m, 'large')).join('')}
                </div>
            `}
        </main>
    `;

    const input = document.getElementById('search-input');
    let timeout;
    input.addEventListener('input', (e) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            state.searchFilter.query = e.target.value;
            const cursor = e.target.selectionStart;
            renderExplore();
            const newInput = document.getElementById('search-input');
            newInput.focus();
            newInput.setSelectionRange(cursor, cursor);
        }, 300);
    });
}

function setFilter(key, value) {
    state.searchFilter[key] = value;
    renderExplore();
}

function renderCategoryPage(type, title) {
    updateHeader(false);

    const perPage = 40;
    const filtered = state.catalog.filter(x => x.type === type);
    const total = filtered.length;
    const totalPages = Math.max(1, Math.ceil(total / perPage));
    const page = Math.min(state.moviesPage, totalPages);
    const start = (page - 1) * perPage;
    const displayed = filtered.slice(start, start + perPage);

    appContainer.innerHTML = `
        <main class="px-4 sm:px-6 max-w-[1600px] mx-auto pb-10 min-h-screen fade-in pt-4">
            <h1 class="text-2xl sm:text-3xl font-black mb-1">${title}</h1>
            <p class="text-xs text-secondary mb-6">${total} títulos disponibles</p>

            ${total === 0 ? `
                <div class="flex flex-col items-center justify-center mt-20 text-center">
                    <i class="fa-solid fa-film text-4xl text-secondary/30 mb-3"></i>
                    <p class="text-secondary text-sm mb-4">No hay ${title.toLowerCase()} en el catálogo.</p>
                    <button onclick="openAdminLogin()" class="bg-accent text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 hover:bg-orange-600 transition-colors shadow-lg shadow-accent/30">
                        <i class="fa-solid fa-plus"></i> Agregar Contenido
                    </button>
                </div>
            ` : `
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-x-3 gap-y-6 mb-10">
                    ${displayed.map(m => movieCard(m, 'large')).join('')}
                </div>

                ${totalPages > 1 ? `
                    <div class="flex items-center justify-center gap-3 pb-8">
                        <button onclick="changePage(-1)" ${page === 1 ? 'disabled' : ''} 
                            class="px-4 py-2.5 rounded-lg ${page === 1 ? 'bg-[#141c2f] text-secondary/40' : 'bg-[#141c2f] text-white hover:bg-cardHover'} border border-white/5 font-medium text-sm flex items-center gap-2">
                            <i class="fa-solid fa-chevron-left"></i> Ant
                        </button>
                        <span class="text-sm text-secondary px-4">${page} / ${totalPages}</span>
                        <button onclick="changePage(1)" ${page === totalPages ? 'disabled' : ''} 
                            class="px-4 py-2.5 rounded-lg ${page === totalPages ? 'bg-[#141c2f] text-secondary/40' : 'bg-[#141c2f] text-white hover:bg-cardHover'} border border-white/5 font-medium text-sm flex items-center gap-2">
                            Sig <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                ` : ''}
            `}
        </main>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changePage(delta) {
    const totalPages = Math.max(1, Math.ceil(state.catalog.length / 40));
    state.moviesPage = Math.max(1, Math.min(totalPages, state.moviesPage + delta));
    if (state.lastRoute === 'movies') renderMoviesPage();
    else if (state.lastRoute === 'series') renderSeriesPage();
    else renderMoviesPage();
}

function toggleFavDetail(type, tmdbId) {

    if (btn) {
        btn.innerHTML = isFav ? '<i class="fa-solid fa-bookmark text-accent"></i> Guardada' : '<i class="fa-regular fa-bookmark"></i> Mi Lista';

function renderWatch(type, tmdbId) {

        appContainer.innerHTML = '<div class="p-8 text-center text-red-500 mt-20">Contenido no encontrado.</div>';

function initBasicPlayer(url) {
    const videoEl = document.getElementById('main-player');
    if (!videoEl) return;

    const bigPlay = document.getElementById('big-play');
    const btnPlay = document.getElementById('btn-play');
    const btnPlayIco = document.getElementById('btn-play-icon');
    const btnBack10 = document.getElementById('btn-back10');
    const btnFwd10 = document.getElementById('btn-fwd10');
    const btnFs = document.getElementById('btn-fs');
    const seekBar = document.getElementById('seek-bar');
    const timeCur = document.getElementById('time-current');
    const timeTot = document.getElementById('time-total');

    const fmtTime = (s) => {
        if (isNaN(s) || s < 0) return '0:00';
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = Math.floor(s % 60).toString().padStart(2, '0');
        if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${sec}`;
        return `${m}:${sec}`;
    };

    const paintSeek = () => {
        const pct = videoEl.duration ? (videoEl.currentTime / videoEl.duration) * 100 : 0;
        seekBar.style.background = `linear-gradient(to right, #ff6b00 ${pct}%, rgba(255,255,255,0.25) ${pct}%)`;
    };
    const doPlayPause = () => {
        if (videoEl.paused) videoEl.play().catch(()=>{});
        else videoEl.pause();
    };

    videoEl.addEventListener('loadedmetadata', () => {
        timeTot.textContent = fmtTime(videoEl.duration);
        paintSeek();
    });

    videoEl.addEventListener('timeupdate', () => {
        timeCur.textContent = fmtTime(videoEl.currentTime);
        if (!seekBar.dataset.dragging) {
            seekBar.value = videoEl.duration ? (videoEl.currentTime / videoEl.duration) * 1000 : 0;
            paintSeek();
        }
    });

    videoEl.addEventListener('play', () => {
        btnPlayIco.className = 'fa-solid fa-pause text-base';
        bigPlay.style.opacity = '0';
        bigPlay.style.pointerEvents = 'none';
    });
    videoEl.addEventListener('pause', () => {
        btnPlayIco.className = 'fa-solid fa-play text-base';
        bigPlay.style.opacity = '1';
        bigPlay.style.pointerEvents = 'auto';
    });

    bigPlay.addEventListener('click', (e) => { e.stopPropagation(); doPlayPause(); });
    btnPlay.addEventListener('click', (e) => { e.stopPropagation(); doPlayPause(); });
    btnBack10.addEventListener('click', (e) => { e.stopPropagation(); videoEl.currentTime = Math.max(0, videoEl.currentTime - 10); });
    btnFwd10.addEventListener('click', (e) => { e.stopPropagation(); videoEl.currentTime = Math.min(videoEl.duration || 0, videoEl.currentTime + 10); });

    seekBar.addEventListener('pointerdown', () => { seekBar.dataset.dragging = '1'; });
    seekBar.addEventListener('input', (e) => {
        e.stopPropagation();
        const pct = e.target.value / 1000;
        if (videoEl.duration) videoEl.currentTime = pct * videoEl.duration;
        paintSeek();
        timeCur.textContent = fmtTime(videoEl.currentTime);
    });
    seekBar.addEventListener('pointerup', () => { delete seekBar.dataset.dragging; });
    seekBar.addEventListener('change', () => { delete seekBar.dataset.dragging; });

    btnFs.addEventListener('click', (e) => {
        e.stopPropagation();
        if (document.fullscreenElement) document.exitFullscreen();
        else videoEl.requestFullscreen();
    });
    paintSeek();
}

function openImportModal() {

async function handleImportFile(e) {

    }
}

function parseTxtContent(text) {
    const lines = text.replace(/\r/g, '').split('\n');
    const items = [];
    let current = null;

    function flush() {
        if (current && current.name && current.url) {
            items.push(current);
        }
        current = null;
    }

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const mName = line.match(/^Nombre\s*:\s*(.+)$/i);
        const mUrl = line.match(/^Url\s*:\s*(.+)$/i);
        const mGenre = line.match(/^Genero\s*:\s*(.+)$/i);
        const mSeason = line.match(/^Temporadas?\s*:\s*(.+)$/i);
        const mEpisodeCount = line.match(/^Episodios?\s*:\s*(.+)$/i);
        const mEpisodeUrl = line.match(/^Episodio\s+(\d+)\s*:\s*(.+)$/i);

        if (mName) {
            if (current) flush();
            current = {
                name: mName[1].trim(),
                url: null,
                genre: null,
                season: 1,
                episodesCount: 0,
                episodes: []
            };
        } else if (mUrl && current) {
            current.url = mUrl[1].trim();
        } else if (mGenre && current) {
            current.genre = mGenre[1].trim();
        } else if (mSeason && current) {
            current.season = parseInt(mSeason[1].trim()) || 1;
        } else if (mEpisodeCount && current) {
            current.episodesCount = parseInt(mEpisodeCount[1].trim()) || 0;
        } else if (mEpisodeUrl && current) {
            const epNum = parseInt(mEpisodeUrl[1]);
            const epUrl = mEpisodeUrl[2].trim();
            current.episodes.push({ episode: epNum, url: epUrl });
        }
    }
    if (current) flush();
    return items;
}

function parseTitleYear(rawName) {
    const m = rawName.match(/^(.*?)\s*\((\d{4})\)\s*$/);
    if (m) return { title: m[1].trim(), year: parseInt(m[2]) };
    return { title: rawName.trim(), year: null };
}

function mapGenre(rawGenre) {
    if (!rawGenre) return 'Otros';
    const parts = rawGenre.split(/[,.\/;|]/).map(s => s.trim().toUpperCase()).filter(Boolean);
    for (const p of parts) {
        if (GENRE_MAP[p]) return GENRE_MAP[p];
        for (const key in GENRE_MAP) {
            if (p.includes(key) || key.includes(p)) return GENRE_MAP[key];
        }
    }
    const upper = rawGenre.toUpperCase();
    for (const key in GENRE_MAP) {
        if (upper.includes(key)) return GENRE_MAP[key];
    }
    return 'Otros';
}

function appendImportLog(msg) {
    const log = document.getElementById('import-log');
    if (!log) return;
    const line = document.createElement('div');
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
}

async function procesarContenido(text) {
    try {
        const rawItems = parseTxtContent(text);

        if (rawItems.length === 0) {
            showToast('⚠️ No se detectaron items válidos', 'error');
            return;
        }

        document.getElementById('import-step-1').classList.add('hidden');
        document.getElementById('import-step-2').classList.remove('hidden');
        document.getElementById('import-log').innerHTML = '';
        appendImportLog(`📄 Procesando texto...`);
        appendImportLog(`🎯 Detectados ${rawItems.length} items (Películas/Series)`);
        appendImportLog('—');

        state.importCancel = false;
        const skipTmdb = document.getElementById('import-skip-tmdb').checked;

        const prepared = rawItems.map((r, i) => {
            const { title, year } = parseTitleYear(r.name);
            const isTv = r.episodes && r.episodes.length > 0;
            
            let episodes = [];
            if (isTv) {
                episodes = r.episodes.map(ep => ({
                    season: r.season || 1,
                    episode: ep.episode,
                    url: ep.url
                }));
            }

            return {
                idx: i, rawName: r.name, title, year,
                videoUrl: r.url,
                rawGenre: r.genre, genre: mapGenre(r.genre),
                type: isTv ? 'tv' : 'movie', 
                episodes: isTv ? episodes : null,
                tmdbId: null,
                poster_path: null, backdrop_path: null,
                overview: '', rating: 0, isHero: false, key: null
            };
        });

        let tmdbDone = 0;
        const total = prepared.length;

        if (!skipTmdb) {
            appendImportLog(`🎬 Buscando en TMDB (0 / ${total})...`);
            const CONC = 4;
            let cursor = 0;

            async function worker() {
                while (cursor < prepared.length && !state.importCancel) {
                    const myIdx = cursor++;
                    const item = prepared[myIdx];
                    try {
                        const searchType = item.type === 'tv' ? 'tv' : 'movie';
                        const hit = await tmdbFindBest(item.title, item.year, searchType);
                        
                        if (hit) {
                            item.tmdbId = String(hit.id);
                            item.poster_path = hit.poster_path || null;
                            item.backdrop_path = hit.backdrop_path || null;
                            item.overview = hit.overview || '';
                            item.rating = hit.vote_average || 0;
                        } else {
                            item.tmdbId = 'local_' + hashString(item.title + '_' + (item.year || ''));
                        }
                    } catch(e) {
                        item.tmdbId = 'local_' + hashString(item.title + '_' + (item.year || ''));
                    }
                    tmdbDone++;
                    if (tmdbDone % 5 === 0 || tmdbDone === total) {
                        updateImportProgress(tmdbDone, total, `TMDB: ${tmdbDone} / ${total}`);
                    }
                }
            }

            await Promise.all(Array.from({ length: CONC }, worker));
        } else {
            prepared.forEach(item => {
                item.tmdbId = 'local_' + hashString(item.title + '_' + (item.year || ''));
            });
            appendImportLog('⚡ Modo rápido activo (Sin TMDB)');
            updateImportProgress(total, total, 'Preparando...');
        }

        appendImportLog('—');
        appendImportLog('🔍 Comparando con catálogo...');
        
        const existingKeys = new Set(state.catalog.map(x => x.key));
        let skippedCount = 0;
        const finalItems = [];

        for (const item of prepared) {
            item.key = item.type === 'tv' 
                ? 'tv_' + hashString(item.title + '_' + (item.year || ''))
                : 'url_' + hashString(item.videoUrl);
            
            if (existingKeys.has(item.key)) {
                skippedCount++;
                continue;
            }
            finalItems.push(item);
            existingKeys.add(item.key);
        }

        appendImportLog(`⏭️ Omitidos ${skippedCount} duplicados.`);

        if (finalItems.length === 0) {
            appendImportLog('⚠️ No hay items nuevos para importar.');
            finishImport(0, skippedCount, 0);
            return;
        }

        appendImportLog(`💾 Guardando ${finalItems.length} items...`);
        
        await dbPutBulk(finalItems, (done, total) => {
            updateImportProgress(done, total, `Guardando: ${done} / ${total}`);
            const chunk = finalItems.slice(done - 100, done);
            state.catalog.push(...chunk);
        });

        finishImport(finalItems.length, skippedCount, finalItems.length);

    } catch(err) {
        console.error(err);
        showToast('❌ Error al importar: ' + err.message, 'error');
        appendImportLog('❌ Error: ' + err.message);
    }
}

function updateImportProgress(done, total, label) {
    const pct = total > 0 ? (done / total) * 100 : 0;
    const bar = document.getElementById('import-progress');
    if (bar) bar.style.width = pct + '%';
    const counter = document.getElementById('import-counter');
    if (counter) counter.textContent = `${done} / ${total}`;
    const status = document.getElementById('import-status');
    if (status) status.textContent = label;
}

function cancelImport() {
    state.importCancel = true;
    document.getElementById('import-cancel-btn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Deteniendo...';
    document.getElementById('import-cancel-btn').disabled = true;
}

function finishImport(imported, skipped, total) {
    document.getElementById('import-step-2').classList.add('hidden');
    document.getElementById('import-step-3').classList.remove('hidden');
    
    const resultDiv = document.getElementById('import-result');
    resultDiv.innerHTML = `
        <div class="text-left bg-black/30 rounded-xl p-4 space-y-1">
            <p><span class="text-green-400 font-bold">✓ ${imported}</span> importados/actualizados</p>
            <p><span class="text-amber-400 font-bold">⏭️ ${skipped}</span> omitidos (ya existían)</p>
            <p class="pt-2 border-t border-white/10 mt-2"><span class="font-bold">${state.catalog.length}</span> total en catálogo</p>
        </div>
    `;
    showToast(`Proceso de importación finalizado`, 'success');
}

function router() {
    try {
        let hash = window.location.hash.substring(1) || 'home';
        const parts = hash.split('/');
        const cleanParts = parts.map(p => p.split('?')[0]);
        window.scrollTo({ top: 0, behavior: 'instant' });

        let params = {};
        if (hash.includes('?')) {
            const queryString = hash.split('?')[1];
            const urlParams = new URLSearchParams(queryString);
            for (const [key, value] of urlParams.entries()) {
                params[key] = value;
            }
        }

        if (state.heroTimer) { clearInterval(state.heroTimer); state.heroTimer = null; }

        if (cleanParts[0] === 'home') { 
            state.lastRoute = 'home'; updateBottomNav('home'); renderHome(); 
        }
        else if (cleanParts[0] === 'explore') { 
            state.lastRoute = 'explore'; 
            updateBottomNav('explore'); 
            if (params.genre) state.searchFilter.genre = params.genre;
            else state.searchFilter.genre = null;
            renderExplore(); 
        }
        else if (cleanParts[0] === 'movies') { 
            state.lastRoute = 'movies'; updateBottomNav('movies'); renderMoviesPage(); 
        }
        else if (cleanParts[0] === 'series') { 
            state.lastRoute = 'series'; updateBottomNav('movies'); renderSeriesPage(); 
        }
        else if (cleanParts[0] === 'popular') { 
            state.lastRoute = 'popular'; updateBottomNav('explore'); renderPopularPage(); 
        }
        else if (cleanParts[0] === 'mylist') { 
            state.lastRoute = 'mylist'; updateBottomNav('mylist'); renderMyList(); 
        }
        else if (cleanParts[0] === 'detail' && cleanParts[1] && cleanParts[2]) { 
            updateBottomNav(''); renderDetail(cleanParts[1], cleanParts[2]); 
        }
        else if (cleanParts[0] === 'watch' && cleanParts[1] && cleanParts[2]) { 
            updateBottomNav(''); renderWatch(cleanParts[1], cleanParts[2]); 
        }
        else if (cleanParts[0] === 'admin') { 
            updateBottomNav(''); renderAdmin(); 
        }
        else window.location.hash = 'home';
    } catch(e) {
        console.error('Router error:', e);
        appContainer.innerHTML = `
            <div class="p-8 text-center mt-20">
                <i class="fa-solid fa-triangle-exclamation text-4xl text-amber-500 mb-3"></i>
                <p class="text-white font-bold mb-2">Algo salió mal</p>
                <p class="text-secondary text-sm mb-4">${escapeHtml(e.message || 'Error inesperado')}</p>
                <button onclick="window.location.hash='home'; location.reload();" class="bg-white text-black font-bold px-6 py-3 rounded-xl">
                    Reintentar
                </button>
            </div>
        `;
    }
}
