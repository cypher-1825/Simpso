<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>Reproductor — Simpsoteca</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="toast-container"></div>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo"><span class="logo-accent">Simps</span>oteca</a>
    <nav class="nav-desktop">
      <a href="index.html">Inicio</a>
      <a href="peliculas.html">Películas</a>
      <a href="series.html">Series</a>
      <a href="explorar.html">Explorar</a>
    </nav>
    <div class="header-actions">
      <a href="admin.html" class="avatar-btn">AD</a>
    </div>
  </div>
</header>
<main class="container" id="app"></main>
<script type="module">
import { Reproductor } from './assets/js/reproductor.js';
function toast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3500);
}
window.toast = toast;

await Reproductor.init();
const params = Object.fromEntries(new URLSearchParams(location.search));
await Reproductor.render(document.getElementById('app'), params);
</script>
</body>
</html>
