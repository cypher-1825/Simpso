<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>Mi Lista — Simpsoteca</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="toast-container"></div>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo"><span class="logo-accent">Simps</span>oteca</a>
    <nav class="nav-desktop">
      <a href="index.html">Inicio</a>
      <a href="peliculas.html">Películas</a>
      <a href="series.html">Series</a>
      <a href="explorar.html">Explorar</a>
    </nav>
    <div class="header-actions">
      <a href="buscar.html" class="icon-btn">🔍</a>
      <a href="admin.html" class="avatar-btn">AD</a>
    </div>
  </div>
</header>
<main class="container" id="app"></main>
<nav class="bottom-nav">
  <a href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>Inicio</span></a>
  <a href="explorar.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><span>Explorar</span></a>
  <a href="peliculas.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg><span>Películas</span></a>
  <a href="mi-lista.html" class="active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg><span>Mi Lista</span></a>
</nav>
<script type="module">
import { Catalogo } from './assets/js/catalogo.js';
import { DB } from './assets/js/database.js';
function toast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3500);
}
window.toast = toast;

await Catalogo.init();
const app = document.getElementById('app');
app.innerHTML = '<div class="spinner"></div>';

try {
  const favs = await DB.getFavorites();
  const items = favs.map(f => f.item).filter(Boolean);

  if (!items.length) {
    app.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔖</div>
        <h2 class="empty-title">Mi Lista está vacía</h2>
        <p class="empty-text">Guarda películas y series desde el detalle de cada título.</p>
        <a href="explorar.html" class="btn btn-accent">Explorar catálogo</a>
      </div>
    `;
  } else {
    app.innerHTML = `
      <div class="listado-header">
        <h1 class="listado-title">Mi Lista</h1>
        <span class="listado-count">${items.length} título${items.length!==1?'s':''}</span>
      </div>
      <div class="grid">${items.map(i => Catalogo.cardHtml(i)).join('')}</div>
    `;
  }
} catch (err) {
  app.innerHTML = `<div class="empty"><p class="empty-text">${Catalogo.escapeHtml(err.message)}</p></div>`;
}
</script>
</body>
</html>
