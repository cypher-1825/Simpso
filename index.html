<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>Simpsoteca</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="toast-container"></div>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo"><span class="logo-accent">Simps</span>oteca</a>
    <nav class="nav-desktop">
      <a href="index.html" class="active">Inicio</a>
      <a href="peliculas.html">Películas</a>
      <a href="series.html">Series</a>
      <a href="explorar.html">Explorar</a>
    </nav>
    <div class="header-actions">
      <a href="buscar.html" class="icon-btn" title="Buscar">🔍</a>
      <a href="admin.html" class="avatar-btn" title="Admin">AD</a>
    </div>
  </div>
</header>

<main class="container">
  <div id="home-content">
    <div class="spinner"></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    <span>Inicio</span>
  </a>
  <a href="explorar.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <span>Explorar</span>
  </a>
  <a href="peliculas.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>
    <span>Películas</span>
  </a>
  <a href="mi-lista.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
    <span>Mi Lista</span>
  </a>
</nav>

<script type="module">
import { DB } from './assets/js/database.js';
import { TMDB } from './assets/js/tmdb.js';

// ---- Toast global ----
function toast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(-20px)';
    setTimeout(() => el.remove(), 300);
  }, 3500);
}
window.toast = toast;

// ---- Helpers ----
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function placeholder(title, w = 342, h = 513) {
  let hash = 0;
  for (let i = 0; i < (title || '').length; i++) hash = ((hash << 5) - hash) + title.charCodeAt(i) | 0;
  const hue = Math.abs(hash) % 360;
  const initials = (title || '?').split(' ').slice(0,2).map(x => x[0] || '').join('').toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="hsl(${hue},25%,22%)"/><stop offset="100%" stop-color="hsl(${hue},25%,10%)"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="${Math.floor(w/4)}" font-weight="900" fill="rgba(255,255,255,.15)">${initials}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function posterUrl(item) {
  if (item?.poster_path) return TMDB.poster(item, 'w342');
  return placeholder(item?.title || '');
}
function backdropUrl(item) {
  if (item?.backdrop_path) return TMDB.backdrop(item, 'w1280');
  if (item?.poster_path) return TMDB.backdrop(item, 'w780');
  return placeholder(item?.title || '', 1280, 720);
}

function cardHtml(item) {
  const poster = posterUrl(item);
  const rating = item.rating ? `<div class="card-rating">★ ${Number(item.rating).toFixed(1)}</div>` : '';
  const type = item.type === 'tv' ? `<div class="card-type">Serie</div>` : '';
  return `
    <a class="card" href="detalle.html?type=${item.type}&key=${encodeURIComponent(item.key)}">
      <div class="card-poster">
        <img src="${poster}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.src='${placeholder(item.title)}'">
        ${rating}${type}
      </div>
      <h3 class="card-title">${escapeHtml(item.title)}</h3>
      <p class="card-sub">${item.genre || ''}</p>
    </a>
  `;
}

function rowHtml(title, items, verTodosHref = null) {
  if (!items.length) return '';
  const link = verTodosHref
    ? `<a class="row-link" href="${verTodosHref}">Ver todo →</a>`
    : '';
  return `
    <section class="row">
      <div class="row-header">
        <h2 class="row-title">${escapeHtml(title)}</h2>
        ${link}
      </div>
      <div class="row-scroll">
        ${items.map(cardHtml).join('')}
      </div>
    </section>
  `;
}

// ---- Render Home ----
async function renderHome() {
  const el = document.getElementById('home-content');
  try {
    await DB.init();
    await TMDB.init();

    const items = await DB.getAll();

    if (!items.length) {
      el.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🎬</div>
          <h1 class="empty-title">Tu catálogo está vacío</h1>
          <p class="empty-text">Ve al panel de administración para configurar tu API key de TMDB e importar tus archivos TXT. Los datos se guardan localmente en este dispositivo.</p>
          <a href="admin.html" class="btn btn-accent">Ir al panel admin</a>
        </div>
      `;
      return;
    }

    const movies = items.filter(i => i.type === 'movie');
    const series = items.filter(i => i.type === 'tv');
    const recientes = [...items].sort((a,b) => (b.addedAt||0) - (a.addedAt||0)).slice(0, 12);
    const conRating = items.filter(i => i.rating > 0).sort((a,b) => b.rating - a.rating).slice(0, 12);

    // Hero: primer item con backdrop
    const hero = items.find(i => i.backdrop_path) || items[0];
    const heroHtml = hero ? `
      <section class="hero">
        <div class="hero-slide active">
          <img src="${backdropUrl(hero)}" alt="${escapeHtml(hero.title)}">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <div class="hero-badge">Destacada</div>
            <h1 class="hero-title">${escapeHtml(hero.title)}</h1>
            <div class="hero-meta">
              ${hero.rating ? `<span>★ ${Number(hero.rating).toFixed(1)}</span>` : ''}
              ${hero.genre ? `<span>${escapeHtml(hero.genre)}</span>` : ''}
              <span>${hero.type === 'tv' ? 'Serie' : 'Película'}</span>
            </div>
            <div class="hero-actions">
              <a href="reproductor.html?type=${hero.type}&key=${encodeURIComponent(hero.key)}" class="btn btn-primary">▶ Reproducir</a>
              <a href="detalle.html?type=${hero.type}&key=${encodeURIComponent(hero.key)}" class="btn btn-secondary">Más info</a>
            </div>
          </div>
        </div>
      </section>
    ` : '';

    // Continuar viendo
    const progressList = await DB.getAllProgress();
    const continuar = [];
    for (const p of progressList) {
      if (p.seconds > 5 && p.duration > 0 && p.seconds < p.duration - 10) {
        const item = items.find(i => i.key === p.key);
        if (item) continuar.push(item);
      }
    }

    // Agrupación por géneros
    const generos = {};
    items.forEach(i => {
      const g = i.genre || 'Otros';
      if (!generos[g]) generos[g] = [];
      generos[g].push(i);
    });
    const generosValidos = Object.keys(generos)
      .filter(g => generos[g].length >= 3)
      .sort((a,b) => generos[b].length - generos[a].length)
      .slice(0, 5);

    el.innerHTML = `
      ${heroHtml}
      ${continuar.length ? rowHtml('Continuar viendo', continuar) : ''}
      ${recientes.length ? rowHtml('Recién añadidas', recientes) : ''}
      ${conRating.length ? rowHtml('Mejor valoradas', conRating, 'peliculas.html') : ''}
      ${movies.length ? rowHtml('Películas', movies.slice(0, 12), 'peliculas.html') : ''}
      ${series.length ? rowHtml('Series', series.slice(0, 12), 'series.html') : ''}
      ${generosValidos.map(g => rowHtml(g, generos[g].slice(0, 12), `explorar.html?genre=${encodeURIComponent(g)}`)).join('')}
    `;
  } catch (err) {
    console.error(err);
    el.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <h1 class="empty-title">Error al cargar</h1>
        <p class="empty-text">${escapeHtml(err.message)}</p>
        <button class="btn btn-accent" onclick="location.reload()">Reintentar</button>
      </div>
    `;
  }
}

renderHome();
</script>

</body>
</html>
